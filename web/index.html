<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d10" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Studio BaaS — Console</title>
    <script>
      // Resolve the theme before first paint so the console never flashes white.
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme');
          var mode = (q === 'light' || q === 'dark' || q === 'system')
            ? q : (localStorage.getItem('studio.theme') || 'system');
          if (q) localStorage.setItem('studio.theme', q);
          var light = mode === 'light' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
          var root = document.documentElement;
          root.dataset.theme = light ? 'light' : 'dark';
          root.style.colorScheme = light ? 'light' : 'dark';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', light ? '#f7f7f9' : '#08080a');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
